spring:
  application:
    name: edge-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-route
              uri: ${CATALOG_SERVICE_URL:http://localhost:9001}/books
              predicates:
                - Path=/books/**
            - id: order-route
              uri: ${ORDER_SERVICE_URL:http://localhost:9002}/orders
              predicates:
                - Path=/orders/**
          httpclient:
            pool:
              type: elastic
              max-idle-time: 15s
              max-life-time: 60s
            response-timeout: 5s
            connect-timeout: 5000
          default-filters:
            - name: Retry
              args:
                retries: 3
                methods: GET
                statuses: INTERNAL_SERVER_ERROR, BAD_GATEWAY, GATEWAY_TIMEOUT
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException, java.net.ConnectException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 2s
                  factor: 2
                  basedOnPreviousValue: true

server:
  port: 9000
  netty:
    connection-timeout: 2s
    idle-timeout: 15s
  shutdown: graceful

logging:
  level:
    root: debug
