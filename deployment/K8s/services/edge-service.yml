apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-service
  labels:
    app: edge-service

spec:
  selector:
    matchLabels:
      app: edge-service

  template:
    metadata:
      labels:
        app: edge-service

    spec:
      containers:
        - name: edge-service
          image: edge-service:1.0.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 9001
          env:
            - name: BPL_JVM_THREAD_COUNT
              value: "50"

---

apiVersion: v1
kind: Service
metadata:
  name: edge-service
  labels:
    app: edge-service

spec:
  type: ClusterIP
  selector:
    app: edge-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
